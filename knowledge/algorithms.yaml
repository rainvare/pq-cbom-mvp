    quantum_bits: 64
    pq_status: at_risk
    nist_status: standardized
    standard: "FIPS 197"
    deprecate_by: "Revisar a largo plazo; preferir AES-256 para datos de vida útil larga"
    replacement: "AES-256 o ChaCha20-Poly1305 (clave de 256 bits)."
    rationale: "Grover reduce la seguridad efectiva a ~64 bits, margen insuficiente a largo plazo."
    references: ["FIPS 197"]
    aliases: ["aes-128", "aes128", "aes_128"]

