    quantum_bits: 192
    pq_status: secure
    nist_status: standardized
    standard: "FIPS 203 (agosto 2024)"
    deprecate_by: null
    replacement: null
    rationale: "Encapsulado de clave basado en retículos (Module-LWE); sin ataque cuántico conocido."
    references: ["FIPS 203"]
    aliases: ["ml-kem", "kyber", "mlkem", "ml-kem-512", "ml-kem-768", "ml-kem-1024", "crystals-kyber"]

  - id: ML-DSA
