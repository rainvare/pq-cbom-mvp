    nist_status: standardized
    standard: "FIPS 205 (agosto 2024)"
    deprecate_by: null
    replacement: null
    rationale: "Firma basada en hash; su seguridad se reduce a la del hash, resistente a cuántica con margen."
    references: ["FIPS 205"]
    aliases: ["slh-dsa", "sphincs", "sphincs+", "sphincsplus"]

  - id: FN-DSA
    name: "FN-DSA (FALCON)"
