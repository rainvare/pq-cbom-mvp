# Base de conocimiento criptográfica — fuente de verdad del modelo de riesgo cuántico
# ===================================================================================
#
# Este archivo es el activo central del producto: el "modelo cuántico de seguridad".
# Describe CADA algoritmo de forma canónica y auditable, independientemente de cómo
# se detecte (código, TLS, CT logs, cabeceras). Los detectores (rules/pq_rules.yaml,
# collectors) solo mapean evidencia -> algorithm_id; la clasificación y el porqué
# salen siempre de aquí.
#
# Campos por algoritmo:
#   id             identificador canónico (coincide con el rule_id de los detectores)
#   name           nombre legible
#   family         asymmetric | symmetric | hash | mac | kdf | protocol
#   primitive      para qué se usa (encryption, signature, key-exchange, kem, hashing...)
#   math_problem   problema matemático subyacente (solo asimétrica/KEM)
#   quantum_attack shor | grover | none   (algoritmo cuántico relevante)
#   classical_bits seguridad efectiva clásica, en bits, en su parámetro común
#   quantum_bits   seguridad efectiva frente a adversario cuántico, en bits
#   pq_status      vulnerable | at_risk | secure | unknown  (ver abajo)
#   nist_status    standardized | candidate | legacy | deprecated | disallowed
#   standard       estándar de referencia (FIPS / RFC / SP)
#   deprecate_by   fecha/hito de deprecación conocido (o null)
#   replacement    reemplazo post-cuántico recomendado (o null si ya es seguro)
#   rationale      justificación de la clasificación
#   references     documentos de referencia
#   aliases        otros nombres por los que se conoce (display / mapeo)
#
# Semántica de pq_status:
#   vulnerable  roto en tiempo polinomial por Shor (asimétrico de factorización/DLP/ECC),
#               o ya roto clásicamente (DES, MD5, RC4...). Migración urgente.
#   at_risk     no roto, pero Grover reduce el margen a la mitad y queda insuficiente a
#               largo plazo (AES-128, SHA-1-como-HMAC marginal, TLS 1.2 según suite).
#   secure      resistente a adversario cuántico conocido (Grover con margen suficiente,
#               o algoritmo post-cuántico estandarizado por NIST).
#   unknown     detectado pero sin parámetro suficiente para clasificar (requiere triage).

version: "2.0.0"

algorithms:

  # ======================================================================
  # ASIMÉTRICA CLÁSICA — rota por Shor (factorización / logaritmo discreto)
  # ======================================================================
  - id: RSA
    name: "RSA"
    family: asymmetric
    primitive: [encryption, signature, key-transport]
    math_problem: integer-factorization
    quantum_attack: shor
    classical_bits: 112          # RSA-2048 ~= 112 bits de seguridad clásica
    quantum_bits: 0
    pq_status: vulnerable
    nist_status: legacy
    standard: "FIPS 186-5 / PKCS#1 (RFC 8017)"
    deprecate_by: "2030 — disallowed 2035 (NIST IR 8547, borrador)"
    replacement: "ML-KEM-768 (FIPS 203) para intercambio de claves; ML-DSA (FIPS 204) para firmas."
    rationale: "Shor factoriza enteros en tiempo polinomial, rompiendo RSA de cualquier tamaño práctico."
    references: ["FIPS 186-5", "NIST IR 8547", "RFC 8017"]
    aliases: ["rsa", "PKCS#1", "RSASSA", "RSA-OAEP", "RSA-PSS"]

  - id: DSA
    name: "DSA (Digital Signature Algorithm)"
    family: asymmetric
    primitive: [signature]
    math_problem: finite-field-discrete-log
    quantum_attack: shor
    classical_bits: 112
    quantum_bits: 0
    pq_status: vulnerable
    nist_status: deprecated
    standard: "FIPS 186-4 (retirado en FIPS 186-5 para generación)"
    deprecate_by: "2023 — NIST ya no permite generación de claves DSA"
    replacement: "ML-DSA (FIPS 204)."
    rationale: "Shor resuelve el logaritmo discreto en campo finito en el que se basa DSA."
    references: ["FIPS 186-5"]
    aliases: ["dsa"]

  - id: DH
    name: "Diffie-Hellman (clásico, campo finito)"
