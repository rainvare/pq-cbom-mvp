    quantum_bits: 0
    pq_status: vulnerable
    nist_status: legacy
    standard: "FIPS 186-5"
    deprecate_by: "2030 — disallowed 2035 (NIST IR 8547)"
    replacement: "ML-DSA (FIPS 204) o SLH-DSA (FIPS 205)."
    rationale: "Shor rompe el logaritmo discreto de curva elíptica."
    references: ["FIPS 186-5", "NIST IR 8547"]
    aliases: ["ecdsa", "secp256r1-sig"]

  - id: ECDH
