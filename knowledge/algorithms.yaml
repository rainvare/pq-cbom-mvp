    quantum_attack: shor
    classical_bits: 112
    quantum_bits: 0
    pq_status: vulnerable
    nist_status: legacy
    standard: "RFC 7919 (FFDHE)"
    deprecate_by: "2030 (NIST IR 8547)"
    replacement: "ML-KEM-768 (FIPS 203); híbrido durante la transición."
    rationale: "Shor rompe el logaritmo discreto en el que se basa Diffie-Hellman clásico."
    references: ["RFC 7919", "NIST IR 8547"]
    aliases: ["diffie-hellman", "dh", "ffdhe", "modp"]

  - id: ECDSA
    name: "ECDSA"
