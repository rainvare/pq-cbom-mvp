    deprecate_by: "2030 (NIST IR 8547)"
    replacement: "ML-DSA (FIPS 204) o SLH-DSA (FIPS 205)."
    rationale: "Firma sobre curva de Edwards; Shor rompe el logaritmo discreto subyacente."
    references: ["RFC 8032", "FIPS 186-5"]
    aliases: ["ed25519", "ed448", "eddsa"]

  - id: ECC-GENERIC
    name: "Criptografía de curva elíptica (genérica)"
    family: asymmetric
    primitive: [signature, key-exchange]
    math_problem: elliptic-curve-discrete-log
    quantum_attack: shor
    classical_bits: 128
    quantum_bits: 0
    pq_status: vulnerable
    nist_status: legacy
    standard: "SP 800-186 (curvas aprobadas)"
    deprecate_by: "2030 (NIST IR 8547)"
    replacement: "ML-KEM (intercambio) o ML-DSA/SLH-DSA (firmas)."
    rationale: "Cualquier esquema sobre curva elíptica es vulnerable a Shor."
    references: ["SP 800-186", "NIST IR 8547"]
    aliases: ["ecc", "secp256k1", "secp256r1", "secp384r1", "secp521r1", "p-256", "p-384", "p-521", "prime256v1"]

  - id: ElGamal
    name: "ElGamal"
    family: asymmetric
    primitive: [encryption]
    math_problem: finite-field-discrete-log
    quantum_attack: shor
    classical_bits: 112
    quantum_bits: 0
    pq_status: vulnerable
    nist_status: legacy
    standard: "No estandarizado por NIST (uso histórico en PGP)"
    deprecate_by: "n/a"
    replacement: "ML-KEM-768 (FIPS 203)."
    rationale: "Cifrado basado en logaritmo discreto; Shor lo rompe en tiempo polinomial."
    references: []
    aliases: ["elgamal"]

