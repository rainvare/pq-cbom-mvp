# Paquete de DETECTORES (solo detección)
# =======================================
# Cada detector mapea evidencia de texto -> algorithm_id. La CLASIFICACIÓN
# (pq_status, rationale, replacement, impacto cuántico, estado NIST...) NO vive
# aquí: sale de knowledge/algorithms.yaml, indexada por ese mismo id.
#
# Formato de cada detector:
#   id     identificador canónico; debe existir en la base de conocimiento
#   match  lista de patrones regex (case-insensitive) que evidencian su uso
# (`category` es opcional; si se omite se toma la `family` de la base de conocimiento)

version: "2.0.0"

rules:
  # --- Asimétrica clásica (rota por Shor) ---
  - id: RSA
    match: ["\\bRSA\\b", "rsa\\.generate_private_key", "RSA\\.generate", "RSA_generate_key", "RsaKeyGenParameterSpec"]
  - id: DSA
    match: ["\\bDSA\\b(?!\\w)", "DSA\\.generate"]
  - id: DH
    match: ["Diffie-?Hellman", "\\bDH\\b(?!\\w)", "DHParameterSpec"]
  - id: ECDSA
    match: ["ECDSA", "SigningKey\\.generate"]
  - id: ECDH
    match: ["ECDHE", "\\bECDH\\b", "X25519", "X448"]
  - id: Hybrid-PQC
    match: ["(x25519|x448|secp256r1|secp384r1|p-?256|p-?384)[-_]?(ml-?kem|kyber)\\d*",
            "(ml-?kem|kyber)\\d*[-_]?(x25519|x448|secp256r1|p-?256)",
            "sntrup761x25519"]
  - id: Ed25519
    match: ["Ed25519", "Ed448"]
  - id: ECC-GENERIC
    match: ["elliptic.?curve", "\\bECC\\b(?!\\w)", "secp256k1", "secp256r1", "P-256", "P-384", "P-521", "prime256v1"]
  - id: ElGamal
    match: ["ElGamal"]

  # --- Post-cuántica NIST estandarizada (segura) ---
  - id: ML-KEM
    match: ["ML[_-]?KEM", "MLKEM", "Kyber"]
  - id: ML-DSA
    match: ["ML[_-]?DSA", "MLDSA", "Dilithium"]
  - id: SLH-DSA
    match: ["SLH-DSA", "SPHINCS\\+?"]
  - id: FN-DSA
    case_sensitive: true
    match: ["FN-DSA", "FALCON", "\\bFalcon\\b"]

  # --- Post-cuántica candidatos / en estandarización ---
  - id: HQC
    match: ["\\bHQC\\b"]
  - id: Classic-McEliece
    match: ["McEliece"]
  - id: BIKE
    match: ["\\bBIKE\\b"]
  - id: NTRU
    match: ["\\bNTRU\\b"]
  - id: FrodoKEM
    match: ["Frodo(KEM)?"]

  # --- Simétrica ---
  - id: AES-256
    match: ["AES-?256", "AES\\.new\\([^)]*32", "AES_256"]
  - id: AES-128
    match: ["AES-?128", "AES_128"]
  - id: AES-192
    match: ["AES-?192", "AES_192"]
  - id: AES-GENERIC
    match: ["\\bAES\\b(?!-?(128|192|256))"]
  - id: ChaCha20
    match: ["ChaCha20"]
  - id: Camellia
    match: ["Camellia"]
  - id: DES
    case_sensitive: true
    match: ["\\bDES\\b", "DES\\.new", "DESede", "DES-EDE", "DES-CBC"]
  - id: 3DES
    match: ["3DES", "TripleDES", "DES3", "DES-EDE3"]
  - id: RC4
    case_sensitive: true
    match: ["\\bRC4\\b", "\\bARC4\\b"]
  - id: Blowfish
    match: ["Blowfish"]

  # --- Hash ---
  - id: MD5
    match: ["\\bMD5\\b", "hashlib\\.md5", "MessageDigest\\.getInstance\\(\"MD5\"\\)"]
  - id: SHA1
    match: ["SHA-?1\\b", "hashlib\\.sha1", "MessageDigest\\.getInstance\\(\"SHA-1\"\\)"]
  - id: SHA-256
    match: ["SHA-?256", "hashlib\\.sha256", "SHA-?384", "SHA-?512"]
  - id: SHA-3
    match: ["SHA-?3(?![0-9])", "hashlib\\.sha3(?![0-9])", "Keccak", "SHAKE(128|256)"]
  - id: BLAKE2
    match: ["BLAKE2[bs]?", "BLAKE3"]

  # --- KDF / hash de contraseñas ---
  - id: PBKDF2
    match: ["PBKDF2"]
  - id: bcrypt
    match: ["\\bbcrypt\\b"]
  - id: Argon2
    match: ["Argon2(id|i|d)?"]

  # --- Protocolo ---
  - id: TLS1.0
    match: ["TLSv?1\\.0", "TLS 1\\.0", "SSLv3"]
  - id: TLS1.1
    match: ["TLSv?1\\.1", "TLS 1\\.1"]
  - id: TLS1.2
    match: ["TLSv?1\\.2", "TLS 1\\.2"]
  - id: TLS1.3
    match: ["TLSv?1\\.3", "TLS 1\\.3"]
  - id: SSHv1
    match: ["SSH-1\\b", "SSHv1", "SSH protocol 1(?![\\d.])"]

  # --- v3: detectores adicionales (bajo riesgo de falso positivo) ---
  # Asimétrica clásica
  - id: Paillier
    match: ["Paillier"]
  - id: Schnorr
    match: ["Schnorr"]
  - id: BLS
    match: ["BLS12-?381"]
  - id: ECIES
    match: ["ECIES"]
  - id: MQV
    case_sensitive: true
    match: ["ECMQV", "\\bMQV\\b"]
  - id: SM2
    match: ["\\bSM2\\b"]
  - id: GOST-R-34.10
    match: ["GOST.?R.?34\\.10", "gostr3410"]
  # PQC adicionales (incl. rotos)
  - id: SIKE
    match: ["\\bSIKE\\b", "\\bSIDH\\b"]
  - id: NTRU-Prime
    match: ["sntrup761", "NTRU.?Prime"]
  - id: XMSS
    match: ["\\bXMSS\\b"]
  - id: SQIsign
    match: ["SQIsign"]
  - id: UOV
    case_sensitive: true
    match: ["\\bUOV\\b"]
  # Simétrica
  - id: Twofish
    match: ["Twofish"]
  - id: Serpent
    match: ["\\bSerpent\\b"]
  - id: Salsa20
    match: ["Salsa20"]
  - id: CAST5
    match: ["CAST5", "CAST-128", "CAST_128"]
  - id: RC2
    match: ["\\bRC2\\b"]
  - id: SM4
    match: ["\\bSM4\\b"]
  - id: Kuznyechik
    match: ["Kuznyechik", "Grasshopper", "GOST.?R.?34\\.12"]
  # Hash
  - id: SM3
    match: ["\\bSM3\\b"]
  - id: Streebog
    match: ["Streebog", "GOST.?R.?34\\.11", "gostr3411"]
  - id: SHA-224
    match: ["SHA-?224"]
  - id: RIPEMD-160
    match: ["RIPEMD-?160", "ripemd160", "\\bRIPEMD\\b"]
  - id: MD4
    match: ["\\bMD4\\b"]
  - id: MD2
    match: ["\\bMD2\\b"]
  - id: Whirlpool
    match: ["Whirlpool"]
  # MAC / KDF
  - id: HMAC
    match: ["\\bHMAC\\b", "hmac\\."]
  - id: CMAC
    match: ["\\bCMAC\\b"]
  - id: GMAC
    match: ["\\bGMAC\\b"]
  - id: Poly1305
    match: ["Poly1305"]
  - id: KMAC
    match: ["\\bKMAC\\b"]
  - id: HKDF
    match: ["\\bHKDF\\b"]
  - id: scrypt
    match: ["\\bscrypt\\b"]
  # Modos de operación
  - id: ECB
    match: ["\\bECB\\b", "MODE_ECB", "AES-ECB"]
  - id: CBC
    match: ["\\bCBC\\b", "MODE_CBC", "AES-CBC"]
  - id: GCM
    match: ["\\bGCM\\b", "AES-?GCM", "MODE_GCM"]
  - id: CTR
    match: ["\\bCTR\\b", "MODE_CTR", "AES-CTR"]
  # Protocolos
  - id: SSHv2
    match: ["OpenSSH", "SSH-2"]
  - id: IKEv1
    match: ["IKEv1", "ISAKMP"]
  - id: IKEv2
    match: ["IKEv2"]
  - id: QUIC
    match: ["\\bQUIC\\b"]
  - id: OpenPGP
    match: ["OpenPGP", "\\bGPG\\b", "\\bPGP\\b"]
