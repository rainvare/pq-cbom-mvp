# Paquete de DETECTORES (solo detección)
# =======================================
# Cada detector mapea evidencia de texto -> algorithm_id. La CLASIFICACIÓN
# (pq_status, rationale, replacement, impacto cuántico, estado NIST...) NO vive
# aquí: sale de knowledge/algorithms.yaml, indexada por ese mismo id.
#
# Formato de cada detector:
#   id     identificador canónico; debe existir en la base de conocimiento
#   match  lista de patrones regex (case-insensitive) que evidencian su uso
# (`category` es opcional; si se omite se toma la `family` de la base de conocimiento)

version: "2.0.0"

rules:
  # --- Asimétrica clásica (rota por Shor) ---
  - id: RSA
    match: ["\\bRSA\\b", "rsa\\.generate_private_key", "RSA\\.generate", "RSA_generate_key", "RsaKeyGenParameterSpec"]
  - id: DSA
    match: ["\\bDSA\\b(?!\\w)", "DSA\\.generate"]
  - id: DH
    match: ["Diffie-?Hellman", "\\bDH\\b(?!\\w)", "DHParameterSpec"]
  - id: ECDSA
    match: ["ECDSA", "SigningKey\\.generate"]
  - id: ECDH
    match: ["\\bECDH\\b", "X25519", "X448"]
  - id: Ed25519
    match: ["Ed25519", "Ed448"]
  - id: ECC-GENERIC
    match: ["elliptic.?curve", "\\bECC\\b(?!\\w)", "secp256k1", "secp256r1", "P-256", "P-384", "P-521", "prime256v1"]
  - id: ElGamal
    match: ["ElGamal"]

  # --- Post-cuántica NIST estandarizada (segura) ---
  - id: ML-KEM
    match: ["ML-KEM", "Kyber", "CRYSTALS-Kyber"]
  - id: ML-DSA
    match: ["ML-DSA", "Dilithium", "CRYSTALS-Dilithium"]
  - id: SLH-DSA
    match: ["SLH-DSA", "SPHINCS\\+?"]
  - id: FN-DSA
    match: ["FN-DSA", "\\bFalcon\\b"]

  # --- Post-cuántica candidatos / en estandarización ---
  - id: HQC
    match: ["\\bHQC\\b"]
  - id: Classic-McEliece
    match: ["McEliece"]
  - id: BIKE
    match: ["\\bBIKE\\b"]
  - id: NTRU
    match: ["\\bNTRU\\b"]
  - id: FrodoKEM
    match: ["Frodo(KEM)?"]

  # --- Simétrica ---
  - id: AES-256
    match: ["AES-?256", "AES\\.new\\([^)]*32", "AES_256"]
  - id: AES-128
    match: ["AES-?128", "AES_128"]
  - id: AES-GENERIC
    match: ["\\bAES\\b(?!-?(128|256))"]
  - id: ChaCha20
    match: ["ChaCha20"]
  - id: Camellia
    match: ["Camellia"]
  - id: DES
    match: ["\\bDES\\b(?!\\w)", "DES\\.new"]
  - id: 3DES
    match: ["3DES", "TripleDES", "DES3", "DES-EDE3"]
  - id: RC4
    match: ["RC4", "ARC4"]
  - id: Blowfish
    match: ["Blowfish"]

  # --- Hash ---
  - id: MD5
    match: ["\\bMD5\\b", "hashlib\\.md5", "MessageDigest\\.getInstance\\(\"MD5\"\\)"]
  - id: SHA1
    match: ["SHA-?1\\b", "hashlib\\.sha1", "MessageDigest\\.getInstance\\(\"SHA-1\"\\)"]
  - id: SHA-256
    match: ["SHA-?256", "hashlib\\.sha256", "SHA-?384", "SHA-?512"]
  - id: SHA-3
    match: ["SHA-?3", "hashlib\\.sha3", "Keccak", "SHAKE(128|256)"]
  - id: BLAKE2
    match: ["BLAKE2[bs]?", "BLAKE3"]

  # --- KDF / hash de contraseñas ---
  - id: PBKDF2
    match: ["PBKDF2"]
  - id: bcrypt
    match: ["\\bbcrypt\\b"]
  - id: Argon2
    match: ["Argon2(id|i|d)?"]

  # --- Protocolo ---
  - id: TLS1.0
    match: ["TLSv?1\\.0", "TLS 1\\.0", "SSLv3"]
  - id: TLS1.1
    match: ["TLSv?1\\.1", "TLS 1\\.1"]
  - id: TLS1.2
    match: ["TLSv?1\\.2", "TLS 1\\.2"]
  - id: TLS1.3
    match: ["TLSv?1\\.3", "TLS 1\\.3"]
  - id: SSHv1
    match: ["SSH-1", "SSHv1", "Protocol 1"]
